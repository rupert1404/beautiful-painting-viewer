    <script>
    function idStringToToken(tokenIdString) {
        return BigInt(tokenIdString).toString(16).padStart(64, '0');
    }
    const paramsString = window.location.search;
    const searchParams = new URLSearchParams(paramsString);
    var tokenIdString = searchParams.get("tokenId");
    var token = idStringToToken(tokenIdString);
